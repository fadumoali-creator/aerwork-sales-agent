<style>
  :root{
    --ink:#252139;
    --ink-2:#332C55;
    --amber:#F58A28;
    --amber-light:#FDF0E3;
    --bg:#F6F5F2;
    --panel:#FFFFFF;
    --border:#E6E3DD;
    --text:#211E30;
    --muted:#6B6779;
    --bubble-user:#252139;
    --bubble-assistant:#F1EFEA;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }

  /* ---- Header ---- */
  header{
    display:flex; align-items:center; gap:12px; padding:14px 22px;
    background:var(--panel); border-bottom:1px solid var(--border); flex-shrink:0;
  }
  .avatar{
    width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,var(--amber),var(--ink));
    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:14px; flex-shrink:0;
    box-shadow:0 2px 6px rgba(37,33,57,.25);
  }
  header .titles{flex:1;}
  header .header-eyebrow{
    font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--amber);
    font-weight:700; margin-bottom:1px;
  }
  header h1{margin:0; font-size:17px; color:var(--ink);}
  header .status-line{margin:1px 0 0; font-size:12px; color:var(--muted);}
  header .status-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:#bbb; margin-right:5px;}
  header .status-dot.live{background:#2fae5c;}

  /* ---- Team tabs ---- */
  #teamTabs{
    display:flex; gap:6px; background:var(--panel); border-bottom:1px solid var(--border);
    padding:0 22px; flex-shrink:0; overflow-x:auto;
  }
  .teamTab{
    padding:11px 16px; font-size:13.5px; font-weight:600; color:var(--muted); cursor:pointer;
    border-bottom:2.5px solid transparent; white-space:nowrap; user-select:none;
  }
  .teamTab:hover{color:var(--ink);}
  .teamTab.active{color:var(--ink); border-bottom-color:var(--amber);}

  /* ---- Chat area ---- */
  #chatWrap{flex:1; overflow-y:auto; padding:22px 0;}
  #chat{max-width:760px; margin:0 auto; padding:0 20px; display:flex; flex-direction:column; gap:16px;}

  .greeting{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    overflow:hidden; text-align:left;
  }
  .greeting .banner{background:var(--ink); color:#fff; padding:16px 22px;}
  .greeting .banner .eyebrow{
    font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:#c9a6f2; margin-bottom:4px;
  }
  .greeting .banner h2{margin:0; font-size:17px; color:#fff;}
  .greeting .body{padding:18px 22px 20px;}
  .greeting .body p{margin:0 0 14px; color:var(--text); font-size:13.5px; line-height:1.5;}
  .chips{display:flex; flex-direction:column; gap:8px;}
  .chip{
    background:#fff; border:1px solid var(--border); color:var(--ink);
    padding:11px 14px; border-radius:8px; font-size:13.5px; font-weight:600; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
  }
  .chip .arrow{color:var(--amber); font-weight:700;}
  .chip:hover{background:var(--amber-light); border-color:#f3d5ae;}

  .msg{display:flex; gap:10px; max-width:100%;}
  .msg.user{flex-direction:row-reverse;}
  .msg .bubble-avatar{
    width:28px; height:28px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; color:#fff; box-shadow:0 1px 3px rgba(37,33,57,.2);
  }
  .msg.assistant .bubble-avatar{background:linear-gradient(135deg,var(--amber),var(--ink));}
  .msg.user .bubble-avatar{background:#9aa2b1;}
  .bubble{
    padding:12px 16px; border-radius:14px; font-size:14.5px; line-height:1.55; max-width:76%;
    white-space:pre-wrap;
  }
  .msg.assistant .bubble{background:var(--bubble-assistant); color:var(--text); border-top-left-radius:4px;}
  .msg.user .bubble{background:var(--bubble-user); color:#fff; border-top-right-radius:4px;}
  .bubble p{margin:0 0 10px;}
  .bubble p:last-child{margin-bottom:0;}

  .draft-card{
    background:#fff; border:1px solid var(--border); border-radius:10px; padding:12px 14px;
    margin:8px 0; position:relative; white-space:pre-wrap; font-size:14px;
  }
  .draft-card .copyBtn{
    position:absolute; top:8px; right:8px; background:transparent; border:1px solid var(--amber);
    color:#a3590f; border-radius:6px; font-size:11.5px; padding:4px 9px; cursor:pointer; font-weight:600;
  }
  .draft-card .copyBtn:hover{background:var(--amber-light);}

  .score-card{
    background:#fff; border:1px solid var(--border); border-radius:12px; overflow:hidden;
    margin:8px 0; max-width:420px;
  }
  .score-card-head{background:var(--ink); color:#fff; padding:11px 16px;}
  .score-card-name{font-weight:700; font-size:14.5px;}
  .score-card-company{font-size:12px; color:#c9c3e0; margin-top:1px;}
  .score-card-main{
    display:flex; align-items:center; gap:14px; padding:14px 16px; border-bottom:1px solid var(--border);
  }
  .score-number{font-size:32px; font-weight:800; color:var(--ink); line-height:1; white-space:nowrap;}
  .score-number span{font-size:15px; font-weight:600; color:var(--muted);}
  .score-badge{
    margin-left:auto; font-size:11.5px; font-weight:700; padding:6px 13px; border-radius:20px;
    white-space:nowrap; letter-spacing:.02em;
  }
  .score-badge.a{background:#E4F6EA; color:#1c7a3d;}
  .score-badge.b{background:#FFF3D6; color:#8a6100;}
  .score-badge.none{background:#F1EFEA; color:var(--muted);}
  .score-breakdown{padding:12px 16px 14px; display:flex; flex-direction:column; gap:7px;}
  .score-row{display:flex; align-items:flex-start; gap:10px; font-size:13px; line-height:1.4;}
  .score-row .pts{
    flex-shrink:0; min-width:28px; text-align:center; font-weight:700; font-size:11.5px;
    border-radius:6px; padding:2px 4px;
  }
  .score-row.plus .pts{background:#E4F6EA; color:#1c7a3d;}
  .score-row.zero .pts{background:#F1EFEA; color:var(--muted);}
  .score-row .label{color:var(--text);}
  .score-row .label b{color:var(--ink);}

  .typing{display:flex; gap:4px; padding:4px 0;}
  .typing span{width:6px; height:6px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite ease-in-out;}
  .typing span:nth-child(2){animation-delay:.2s;}
  .typing span:nth-child(3){animation-delay:.4s;}
  @keyframes blink{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

  .error-bubble{
    background:#FDECEA; border:1px solid #F3B3AC; color:#8a271f; border-radius:10px;
    padding:10px 14px; font-size:13.5px; max-width:76%;
  }

  /* ---- Input bar ---- */
  #inputBar{
    border-top:1px solid var(--border); background:var(--panel); padding:14px 20px; flex-shrink:0;
  }
  #inputInner{max-width:760px; margin:0 auto; display:flex; align-items:flex-end; gap:10px;}
  #textInput{
    flex:1; resize:none; border:1px solid var(--border); border-radius:14px; padding:11px 14px;
    font-size:14.5px; font-family:inherit; max-height:140px; min-height:44px; background:#fbfbfa;
  }
  #textInput:focus{outline:2px solid var(--amber); outline-offset:1px;}
  #sendBtn{
    width:42px; height:42px; border-radius:50%; background:var(--ink); border:none; color:#fff;
    font-size:17px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  #sendBtn:disabled{opacity:.4; cursor:default;}
  #sendBtn:hover:not(:disabled){background:var(--ink-2);}
  .footnote{max-width:760px; margin:8px auto 0; font-size:11.5px; color:var(--muted); text-align:center;}
</style>
</head>
<body>

  <header>
    <div class="avatar">SD</div>
    <div class="titles">
      <div class="header-eyebrow">School of Doers</div>
      <h1 id="pageTitle">Tiimiagentit</h1>
      <p class="status-line"><span class="status-dot live" id="statusDot"></span><span id="statusText">Valmis keskustelemaan</span></p>
    </div>
  </header>

  <div id="teamTabs">
    <div class="teamTab" data-team="sales">Sales</div>
    <div class="teamTab" data-team="marketing">Marketing</div>
    <div class="teamTab" data-team="social">Social media</div>
  </div>

  <div id="chatWrap">
    <div id="chat"></div>
  </div>

  <div id="inputBar">
    <div id="inputInner">
      <textarea id="textInput" placeholder="Kirjoita viesti..." rows="1"></textarea>
      <button id="sendBtn" title="Lähetä">➤</button>
    </div>
    <p class="footnote">Kaikki vastaukset ovat luonnoksia — tarkista ja lähetä itse.</p>
  </div>

<script>
const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------------------
// TIIMIKONFIGURAATIOT (frontend-puoli: vain esittelyteksti + aloituschipit —
// varsinaiset system-promptit ja työkalut elävät palvelimella,
// school-of-doers/netlify/functions/chat-background.js:ssä, team-parametrin mukaan valiten)
// ---------------------------------------------------------------------------
const TEAMS = {
  sales: {
    label: 'Sales',
    eyebrow: 'School of Doers · Sales Agent',
    title: 'Sales-tiimin agentti',
    intro: 'Käyn puolestasi läpi liidin pisteytyksen, taustatutkimuksen ja viestiluonnokset — sekä tulkitsen saamasi vastaukset. Kaikki tuotokset ovat luonnoksia; en koskaan lähetä mitään itse. Valitse aloitustoiminto, tai kirjoita suoraan alla olevaan kenttään.',
    chips: [
      'Haluan pisteyttää uuden liidin. Kysy minulta tarvittavat tiedot yksi kerrallaan.',
      'Sain vastauksen, jonka haluan käydä läpi kanssasi.',
      'Näytä liidilistani ja kerro kenelle pitäisi laittaa follow-up.',
      'Miten tämä agentti oikein toimii ja millä säännöillä se pisteyttää liidit?'
    ]
  },
  marketing: {
    label: 'Marketing',
    eyebrow: 'School of Doers · Marketing Agent',
    title: 'Marketing-tiimin agentti',
    intro: 'Autan sinua kampanjasuunnittelussa: kohderyhmästä ja viestilinjasta kanaviin ja aikatauluun. Ylläpidän myös pysyvää kampanjakalenteria. Valitse aloitustoiminto, tai kirjoita suoraan alla olevaan kenttään.',
    chips: [
      'Haluan suunnitella uuden kampanjan. Kysy minulta tarvittavat tiedot yksi kerrallaan.',
      'Näytä nykyinen kampanjakalenteri.',
      'Tee markkinatutkimus kilpailijoiden vastaavasta tarjonnasta.',
      'Miten tämä agentti oikein toimii?'
    ]
  },
  social: {
    label: 'Social media',
    eyebrow: 'School of Doers · Social Media Agent',
    title: 'Social media -tiimin agentti',
    intro: 'Autan sinua postausideoissa, caption-luonnoksissa ja sisältökalenterin ylläpidossa — kanavakohtaisella sävyllä. Valitse aloitustoiminto, tai kirjoita suoraan alla olevaan kenttään.',
    chips: [
      'Ideoi postauksia uudesta aiheesta. Kysy minulta tarvittavat tiedot.',
      'Näytä nykyinen sisältökalenteri.',
      'Hae ajankohtaisia some-trendejä alaltamme.',
      'Miten tämä agentti oikein toimii?'
    ]
  }
};

let currentTeam = 'sales';
// Jokaisella tiimillä oma keskusteluhistoria (Anthropic-muodossa) ja oma
// renderöity DOM-tila, jotta välilehden vaihto ei sekoita keskusteluja keskenään.
const state = {
  sales: { history: [], greetingDismissed: false },
  marketing: { history: [], greetingDismissed: false },
  social: { history: [], greetingDismissed: false }
};

function setStatus(ok, msg){
  $('statusDot').classList.toggle('live', ok);
  $('statusText').textContent = msg;
}

// ---- chat rendering ----
function scrollToBottom(){
  const wrap = $('chatWrap');
  wrap.scrollTop = wrap.scrollHeight;
}

function escapeHtml(s){
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parseScoreBlock(raw){
  const lines = raw.split('\n').map(l => l.trim()).filter(l => l.length);
  if (lines.length < 2) return null;

  const nameLine = lines[0].split(/\s+—\s+|\s+-\s+/);
  if (nameLine.length < 2) return null;
  const name = nameLine[0].trim();
  const company = nameLine.slice(1).join(' - ').trim();

  const scoreMatch = lines[1].match(/^(\d+)\/14\s*[—-]\s*Prioriteetti\s+(A|B|EI JATKOTOIMIA)/i);
  if (!scoreMatch) return null;
  const total = scoreMatch[1];
  const priorityRaw = scoreMatch[2].toUpperCase();
  const priorityClass = priorityRaw === 'A' ? 'a' : (priorityRaw === 'B' ? 'b' : 'none');
  const priorityLabel = priorityRaw === 'EI JATKOTOIMIA' ? 'Ei jatkotoimia' : ('Prioriteetti ' + priorityRaw);

  const rows = [];
  for (let i = 2; i < lines.length; i++){
    const m = lines[i].match(/^([+-]?\d+)\s+(.+)$/);
    if (!m) continue;
    rows.push({ pts: m[1], label: m[2] });
  }
  if (!rows.length) return null;

  return { name, company, total, priorityClass, priorityLabel, rows };
}

function buildScoreCard(data){
  const card = document.createElement('div');
  card.className = 'score-card';

  const head = document.createElement('div');
  head.className = 'score-card-head';
  const nameEl = document.createElement('div');
  nameEl.className = 'score-card-name';
  nameEl.textContent = data.name;
  const companyEl = document.createElement('div');
  companyEl.className = 'score-card-company';
  companyEl.textContent = data.company;
  head.appendChild(nameEl);
  head.appendChild(companyEl);
  card.appendChild(head);

  const main = document.createElement('div');
  main.className = 'score-card-main';
  const numEl = document.createElement('div');
  numEl.className = 'score-number';
  numEl.innerHTML = escapeHtml(data.total) + '<span>/14</span>';
  const badge = document.createElement('div');
  badge.className = 'score-badge ' + data.priorityClass;
  badge.textContent = data.priorityLabel;
  main.appendChild(numEl);
  main.appendChild(badge);
  card.appendChild(main);

  const breakdown = document.createElement('div');
  breakdown.className = 'score-breakdown';
  data.rows.forEach(row => {
    const rowEl = document.createElement('div');
    const isZero = /^[+-]?0$/.test(row.pts);
    rowEl.className = 'score-row ' + (isZero ? 'zero' : 'plus');
    const ptsEl = document.createElement('span');
    ptsEl.className = 'pts';
    ptsEl.textContent = row.pts.startsWith('+') || row.pts.startsWith('-') ? row.pts : ('+' + row.pts);
    const labelEl = document.createElement('span');
    labelEl.className = 'label';
    labelEl.innerHTML = escapeHtml(row.label).replace(/^([^:]+):/, '<b>$1</b>:');
    rowEl.appendChild(ptsEl);
    rowEl.appendChild(labelEl);
    breakdown.appendChild(rowEl);
  });
  card.appendChild(breakdown);

  return card;
}

function renderAssistantContent(text){
  // split on triple-backtick blocks, render those as draft cards (or score cards) with copy buttons
  const parts = text.split(/```/);
  const frag = document.createDocumentFragment();
  parts.forEach((part, i) => {
    if (i % 2 === 1){
      let clean = part.replace(/^\n/, '').replace(/\n$/, '');

      if (/^pisteytys\s*\n/i.test(clean)){
        const scoreData = parseScoreBlock(clean.replace(/^pisteytys\s*\n/i, ''));
        if (scoreData){
          frag.appendChild(buildScoreCard(scoreData));
          return;
        }
        clean = clean.replace(/^pisteytys\s*\n/i, '');
      }

      const card = document.createElement('div');
      card.className = 'draft-card';
      const btn = document.createElement('button');
      btn.className = 'copyBtn';
      btn.textContent = 'Kopioi';
      btn.onclick = () => {
        navigator.clipboard.writeText(clean).then(() => {
          btn.textContent = 'Kopioitu ✓';
          setTimeout(() => btn.textContent = 'Kopioi', 1400);
        });
      };
      card.appendChild(btn);
      const body = document.createElement('div');
      body.textContent = clean;
      body.style.marginTop = '4px';
      card.appendChild(body);
      frag.appendChild(card);
    } else if (part.trim()) {
      part.trim().split(/\n\n+/).forEach(paragraph => {
        const p = document.createElement('p');
        p.innerHTML = escapeHtml(paragraph).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        frag.appendChild(p);
      });
    }
  });
  return frag;
}

function addMessage(role, text){
  const row = document.createElement('div');
  row.className = 'msg ' + role;
  const av = document.createElement('div');
  av.className = 'bubble-avatar';
  av.textContent = role === 'user' ? 'S' : 'SD';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (role === 'assistant'){
    bubble.appendChild(renderAssistantContent(text));
  } else {
    bubble.textContent = text;
  }
  row.appendChild(av);
  row.appendChild(bubble);
  $('chat').appendChild(row);
  scrollToBottom();
  return row;
}

let typingHintTimer = null;

function addTyping(){
  const row = document.createElement('div');
  row.className = 'msg assistant';
  row.id = 'typingRow';
  const av = document.createElement('div');
  av.className = 'bubble-avatar';
  av.textContent = 'SD';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.id = 'typingBubble';
  bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
  row.appendChild(av);
  row.appendChild(bubble);
  $('chat').appendChild(row);
  scrollToBottom();

  const hints = ['Mietin...', 'Tarkistan lähteitä...', 'Vielä hetki, kokoan vastausta...'];
  let hintIndex = 0;
  typingHintTimer = setInterval(() => {
    const bubbleEl = $('typingBubble');
    if (!bubbleEl) return;
    const hintEl = bubbleEl.querySelector('.typing-hint');
    if (hintEl){
      hintEl.textContent = hints[hintIndex % hints.length];
      hintIndex++;
    } else if (hintIndex === 0){
      const span = document.createElement('div');
      span.className = 'typing-hint';
      span.style.cssText = 'font-size:12px; color:var(--muted); margin-top:4px;';
      span.textContent = hints[0];
      bubbleEl.appendChild(span);
      hintIndex++;
    }
  }, 4000);
}

function removeTyping(){
  if (typingHintTimer){ clearInterval(typingHintTimer); typingHintTimer = null; }
  const row = $('typingRow');
  if (row) row.remove();
}

function addErrorBubble(msg){
  const row = document.createElement('div');
  row.className = 'msg assistant';
  const av = document.createElement('div');
  av.className = 'bubble-avatar';
  av.textContent = '!';
  const bubble = document.createElement('div');
  bubble.className = 'error-bubble';
  bubble.textContent = msg;
  row.appendChild(av);
  row.appendChild(bubble);
  $('chat').appendChild(row);
  scrollToBottom();
}

function buildGreeting(team){
  const cfg = TEAMS[team];
  const wrap = document.createElement('div');
  wrap.className = 'greeting';
  wrap.id = 'greeting';

  const banner = document.createElement('div');
  banner.className = 'banner';
  banner.innerHTML = `<div class="eyebrow">${escapeHtml(cfg.eyebrow)}</div><h2>${escapeHtml(cfg.title)}</h2>`;
  wrap.appendChild(banner);

  const body = document.createElement('div');
  body.className = 'body';
  const p = document.createElement('p');
  p.textContent = cfg.intro;
  body.appendChild(p);

  const chips = document.createElement('div');
  chips.className = 'chips';
  cfg.chips.forEach(msg => {
    const chip = document.createElement('div');
    chip.className = 'chip';
    chip.setAttribute('data-msg', msg);
    chip.innerHTML = `<span>${escapeHtml(msg)}</span><span class="arrow">→</span>`;
    chip.addEventListener('click', () => sendMessage(msg));
    chips.appendChild(chip);
  });
  body.appendChild(chips);
  wrap.appendChild(body);

  return wrap;
}

// Renderöi koko keskustelun uudelleen nykyisen tiimin historian pohjalta —
// kutsutaan välilehden vaihdon yhteydessä, jotta jokaisella tiimillä säilyy
// oma näkymä eikä keskustelut sekoitu.
function renderTeam(team){
  const chat = $('chat');
  chat.innerHTML = '';
  const s = state[team];

  if (!s.history.length){
    chat.appendChild(buildGreeting(team));
    return;
  }

  s.history.forEach(m => {
    const text = typeof m.content === 'string' ? m.content : '';
    addMessage(m.role, text);
  });
}

function switchTeam(team){
  if (!TEAMS[team] || team === currentTeam) { currentTeam = team; }
  currentTeam = team;
  document.querySelectorAll('.teamTab').forEach(tab => {
    tab.classList.toggle('active', tab.getAttribute('data-team') === team);
  });
  $('pageTitle').textContent = TEAMS[team].title;
  renderTeam(team);
}

function makeJobId(){
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'job-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function sleep(ms){
  return new Promise(resolve => setTimeout(resolve, ms));
}

// Vastaus lasketaan Netlifyn taustafunktiossa (chat-background.js), jolla
// on aikaa jopa 15 minuuttia. Tämä funktio käynnistää laskennan ja pollaa
// sen jälkeen chat-status.js:ää kunnes tulos on valmis.
async function callAgent(team, messages){
  const jobId = makeJobId();

  const startRes = await fetch('/.netlify/functions/chat-background', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ team, history: messages, jobId })
  });
  if (!startRes.ok){
    throw new Error('Palvelinvirhe (' + startRes.status + ') — käsittelyä ei saatu käyntiin.');
  }

  const maxWaitMs = 120000;
  const pollIntervalMs = 1500;
  const startedAt = Date.now();

  await sleep(900);

  while (Date.now() - startedAt < maxWaitMs){
    const res = await fetch('/.netlify/functions/chat-status?id=' + encodeURIComponent(jobId));
    const data = await res.json().catch(() => ({}));

    if (!res.ok || (data && data.status === 'error')){
      throw new Error((data && data.error) || ('Palvelinvirhe (' + res.status + ').'));
    }
    if (data && data.status === 'done'){
      return data.text || '';
    }
    await sleep(pollIntervalMs);
  }

  throw new Error('Vastaus kesti liian kauan (yli 2 min) — yritä uudelleen, tai lyhennä kysymystä.');
}

async function sendMessage(text){
  if (!text.trim()) return;
  const team = currentTeam;
  const s = state[team];

  const greeting = $('greeting');
  if (greeting) greeting.remove();

  addMessage('user', text);
  s.history.push({ role: 'user', content: text });

  $('sendBtn').disabled = true;
  addTyping();
  try {
    const reply = await callAgent(team, s.history);
    removeTyping();
    addMessage('assistant', reply);
    s.history.push({ role: 'assistant', content: reply });
  } catch (err) {
    removeTyping();
    s.history.pop();
    addErrorBubble(err.message);
  } finally {
    $('sendBtn').disabled = false;
  }
}

$('sendBtn').addEventListener('click', () => {
  const val = $('textInput').value;
  $('textInput').value = '';
  $('textInput').style.height = 'auto';
  sendMessage(val);
});

$('textInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    $('sendBtn').click();
  }
});

$('textInput').addEventListener('input', function(){
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 140) + 'px';
});

document.querySelectorAll('.teamTab').forEach(tab => {
  tab.addEventListener('click', () => switchTeam(tab.getAttribute('data-team')));
});

setStatus(true, 'Valmis keskustelemaan');
switchTeam('sales');
</script>
